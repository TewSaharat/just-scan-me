<div class="usermanagementcontainer">

  <h3 class="title">รายชื่อผู้ใช้</h3>

  <div *ngIf="users.length === 0" class="no-data">ไม่มีข้อมูลผู้ใช้</div>

  <div class="tablewrapper">
    <table class="usertable">
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>อีเมล</th>
          <th>หมวดที่ดูแล</th>
          <th>สถานะปัจจุบัน</th>
          <th>เปลี่ยนสถานะ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ districtMap[+user.Category_code] || 'ไม่ระบุ' }}</td>

          <td>{{ user.role }}</td>
          <td>
        <select [(ngModel)]="user.newStatus" class="status-select">
            
            <option value="user">user</option>
            <option value="admin">admin</option>
            <option value="viewer">viewer</option>
            <option value="Advanced_users">Advanced_users</option>

        </select>
            <button (click)="confirmChange(user)" class="change-btn">เปลี่ยน</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<router-outlet></router-outlet>
