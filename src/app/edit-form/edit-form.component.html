<div class="ediform">
  <h1 class="form-header">แก้ไขข้อมูลเสาไฟฟ้า</h1>
  <div class="form-container">
      <!-- Left Column -->
      <div class="form-column">
          <label>ชนิดของหลอดไฟ</label>
          <select [(ngModel)]="data.lampType_edit" [disabled]="isViewer" >
              <option *ngFor="let type of lampType_edit" [value]="type">{{ type }}</option>
          </select>

          <label>ตู้คอนโทรล</label>
          <input type="text" [(ngModel)]="data.control" [disabled]="isViewer" />

          <label>วันที่ก่อสร้าง</label>
          <input type="date" [(ngModel)]="data.constructionDate" [disabled]="isViewer" />

          <label>สัญญาที่</label>
          <input type="text" [(ngModel)]="data.contractNumber" [disabled]="isViewer" />

          <label>หมายเหตุ</label>
          <input type="text" [(ngModel)]="data.notes"  [disabled]="isViewer" />
      </div>

      <!-- Right Column -->
      <div class="form-column">
          <div class="toggle-container">
              <label class="switch">
                  <input type="checkbox" [(ngModel)]="toggleStatusTemp" (change)="toggleStatus()" />
                  <span class="slider"></span>
              </label>
              <span>สถานะเสาไฟฟ้า {{ data.status ? 'ใช้ได้' : 'เสีย' }}</span>
          </div>

          <div *ngIf="toggleStatusTemp; else complaintTemplate">
              <label>วิธีซ่อม</label>
              <input type="text" [(ngModel)]="data.repairMethod" [disabled]="isViewer"  />

              <label>รายการที่ซ่อม</label>
              <div class="repair-item-grid">
                  <div *ngFor="let item of repairItemList" class="repair-item">
                      <input type="checkbox" [(ngModel)]="data.repairItems[item.value]" [disabled]="isViewer"  />
                      <span>{{ item.label }}</span>
                  </div>
              </div>

              <label><b>ชนิดตู้ควบคุม</b></label>
              <select [(ngModel)]="data.controlType" [disabled]="isViewer" >
                  <option value="switchboard">Switchboard (เบรกเกอร์)</option>
                  <option value="safetySwitch">Safety switch (ฟิวส์)</option>
              </select>

              <label><b>วันที่ซ่อมครั้งล่าสุด</b></label>
              <input type="text" [(ngModel)]="data.lastRepairDate"  [disabled]="isViewer" />
          </div>

          <ng-template #complaintTemplate>
              <label>ช่องทางร้องเรียน</label>
              <input type="text" [(ngModel)]="data.complaintChannel" [disabled]="isViewer"  />

              <label>รหัสเรื่อง</label>
              <input type="text" [(ngModel)]="data.complaintCode"  [disabled]="isViewer" />

              <label>เรื่อง</label>
              <input type="text" [(ngModel)]="data.complaintTopic" [disabled]="isViewer" />

              <label>สาเหตุ</label>
              <input type="text" [(ngModel)]="data.complaintReason" [disabled]="isViewer" />
          </ng-template>
      </div>
  </div>

  <div class="form-actions">
      <button type="button" (click)="onSave()" [disabled]="isViewer" >บันทึก</button>
      
      <button type="button" (click)="onCancel()">ยกเลิก</button>
  </div>
<div *ngIf="showLottieMessage" class="lottie-overlay">
  <lottie-player
    [src]="lottieMessageUrl"
    background="transparent"
    speed="1"
    style="width: 300px; height: 300px; margin: auto;"
    autoplay
  ></lottie-player>
  <p style="text-align: center; font-size: 18px; margin-top: 10px;">
    {{ lottieMessageText }}
  </p>
</div>
  <!-- Lottie แจ้งผล -->
<div *ngIf="loginSuccess" class="lottie-overlay">
  <lottie-player
    src="https://assets10.lottiefiles.com/packages/lf20_jbrw3hcz.json"
    background="transparent"
    speed="1"
    style="width: 300px; height: 300px; margin: auto;"
    autoplay
  ></lottie-player>
</div>

<div *ngIf="loginError" class="lottie-overlay">
  <lottie-player
    src="https://lottie.host/9ad4e8f7-c6c0-44d3-8aaf-542db78af29c/6SLYllOfgM.json"
    background="transparent"
    speed="1"
    style="width: 300px; height: 300px; margin: auto;"
    autoplay
  ></lottie-player>
  
  
</div>

</div>
